[package]
name = "gldt_swap_common"
version = "0.1.0"
description = "GLDT forward and reserve swap to GLD - api"
edition = "2021"

[features]
default = []  # Empty default features
inttest = []

[dependencies]
candid = { workspace = true }
bity-ic-canister-time = { workspace = true }
icrc-ledger-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
types = { path = '../../../libraries/types' }
origyn_nft_canister_c2c_client = { path = "../../../external_canisters/origyn_nft/c2c_client" }
minicbor = { workspace = true, features = ["alloc", "derive"] }
cbor = { path = '../../../libraries/cbor' }