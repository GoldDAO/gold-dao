[package]
name = "gldt_swap_index_api_canister"
version = "0.1.0"
description = "GLDT forward and reserve swap to GLD - api"
edition = "2021"

[features]
default = []  # Empty default features
inttest = []

[dependencies]
candid = { workspace = true }
icrc-ledger-types = { workspace = true }
serde = { workspace = true, features = ["derive"] }
serde_bytes = { workspace = true}
types = { path = '../../../libraries/types' }
utils = { path = '../../../libraries/utils' }
bity-ic-icrc3 = {workspace = true }
minicbor = { workspace = true, features = ["alloc", "derive"] }
ic-stable-structures = { workspace = true }
bity-ic-types = { workspace = true }
gldt_swap_common = { path = "../../gldt_swap/common"}
cbor = { path = '../../../libraries/cbor' }