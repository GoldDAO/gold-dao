################################################################################
# Cache preparation
################################################################################
node cache:
  stage: preparation
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "client/**/*.{js,ts,json,jsx,tsx,md,mdx,css,html,svg}"
        - "client/**/pnpm-lock.yaml"
        - "pnpm-workspace.yaml"
  extends: .node template
  script:
    - pnpm pkg get name description author license workspaces engines
    - node --version
    - pnpm --version

################################################################################
# Linters
################################################################################

# See includes above for frontends lint

rust lint:
  stage: lint
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
      changes:
        - "Cargo.{lock,toml}"
        - "backend/**/*.{rs,toml,lock,md,did,wasm,gz}"
    - if: $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_REF_NAME == "develop"
      changes:
        - "Cargo.{lock,toml}"
        - "backend/**/*.{rs,toml,lock,md,did,wasm,gz}"
  extends: .rust template
  script:
    - cargo clippy
