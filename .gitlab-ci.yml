default:
  image: dckreg.bity.com/runners-images/dfinity-canisters:0.29.2@sha256:f68a1ad63ab884cdc1555a05f8dcc9f371fa097d911af97c551350d1e955b5da
  interruptible: true
  before_script:
    - dfx --version
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - runner_unsupported
      - unknown_failure

cache:
  - key: "dfx-$CI_COMMIT_REF_SLUG"
    paths:
      - .dfx

stages:
  - preparation
  - lint
  - test
  - integration_testing
  - build
  - deploy

