# Rust unit tests
#
# One job for the whole workspace. With one job per canister every job compiled
# the shared dependencies again, once per crate folder of the canister, and the
# tests of the crates under backend/libraries only ran when that folder changed.
# The integration tests have their own jobs (.integration_tests.yml).

rust unit tests:
  stage: test
  extends: .rust template
  variables:
    # Without these the job gets the runner defaults: a request of 200Mi and
    # limits of 2Gi and 1 CPU. The scheduler reserves the request, not the
    # limit, and the runner node has 7.2 GiB and 3.7 cores.
    KUBERNETES_MEMORY_REQUEST: "2Gi"
    KUBERNETES_MEMORY_LIMIT: "5Gi"
    KUBERNETES_CPU_REQUEST: "1"
    KUBERNETES_CPU_LIMIT: "2"
  rules:
    # Not on the merge request from develop, see the note on "rust lint" in .gitlab-ci.yml
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop"
      changes: &rust_unit_test_changes
        - "Cargo.{lock,toml}"
        # .did: every canister includes its api/can.did at compile time
        - "backend/libraries/**/*.{rs,toml,did}"
        - "backend/external_canisters/**/*.{rs,toml,did}"
        - "backend/canisters/**/*.{rs,toml,did}"
        # A change to the job itself or to its image is tried on its merge request
        - "scripts/ci-cd/.{rust_template,canister_unit_test_coverage}.yml"
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes: *rust_unit_test_changes
  script:
    - cargo test --workspace --exclude integration_testing
