# Rust / Cargo (for wasm builds) template

.rust template:
  image: dckreg.bity.com/bity/runners-images/rust-dfinity-build-ci:latest@sha256:ac1dccc3227d9bd667d59ebff24199a858240755c7cf6b95298bb30c014282d5
  before_script:
    - cargo --version
    - rustc --version
  retry:
    max: 2
    when:
      - runner_system_failure
      - stuck_or_timeout_failure
      - api_failure
      - runner_unsupported
      - unknown_failure
