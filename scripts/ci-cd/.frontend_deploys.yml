spec:
  inputs:
    src-folder:
      description: The NextJS project folder name. Must be located in the /client/ folder
      options:
        [
          "gld_dashboard",
          "gld_landing_page",
          "internal_dashboard"
        ]
    sns-controlled:
      description: Whether or not the canister is SNS controlled
      options: ["true", "false"]
    deploy-to-preprod:
      description: Whether to generate the preprod deploy job for this frontend. Set to "false" when no preprod canister id is registered.
      default: "true"
      options: ["true", "false"]
---

# STAGING AND PREPROD DEPLOYMENT
#
# The "changes" lists are the ones of the builds in .frontend_builds.yml. A
# deploy job needs its build, so its list must never match more than the
# list of the build does.
#
# Every deploy job, frontend or backend, has an environment of its own named
# "<tier>/<canister>" (staging/, preprod/, production/). The production key and
# proposer neuron (PEM_FILE_PRODUCTION, SNS_PROPOSER_NEURON_ID_PRODUCTION) can
# then be limited to the environment scope "production/*" in the GitLab
# settings, so only the production deploy jobs receive them. Build jobs must
# keep environment names outside "production/".

.staging deploy template:
  stage: deploy
  interruptible: false
  resource_group: frontend staging deployment
  variables:
    PEM_FILE: "${PEM_FILE_STAGING}"
  # No didc here: staging and preprod are deployed directly, without a proposal
  before_script:
    - !reference [.import dfx identity, before_script]

$[[ inputs.src-folder ]] staging deploy:
  extends: .staging deploy template
  variables:
    TARGET_NETWORK: staging
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "client/$[[ inputs.src-folder ]]/**/*"
        - "pnpm-workspace.yaml"
        - ".npmrc"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop"
      changes:
        - "client/$[[ inputs.src-folder ]]/**/*"
        - "pnpm-workspace.yaml"
        - ".npmrc"
        - "scripts/ci-cd/.{node_template,dfx_templates,frontend_builds,frontend_deploys}.yml"
      when: manual
      allow_failure: true
  needs: ["$[[ inputs.src-folder ]] staging build"]
  script:
    - dfx deploy --network $TARGET_NETWORK --no-wallet --mode reinstall -y $[[ inputs.src-folder ]]
  environment:
    name: staging/$[[ inputs.src-folder ]]
    deployment_tier: staging
    action: start

$[[ inputs.src-folder ]] preprod deploy:
  extends: .staging deploy template
  variables:
    TARGET_NETWORK: preprod
  rules:
    - if: '"$[[ inputs.deploy-to-preprod ]]" != "true"'
      when: never
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event"
      changes:
        - "client/$[[ inputs.src-folder ]]/**/*"
        - "pnpm-workspace.yaml"
        - ".npmrc"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop"
      changes:
        - "client/$[[ inputs.src-folder ]]/**/*"
        - "pnpm-workspace.yaml"
        - ".npmrc"
        - "scripts/ci-cd/.{node_template,dfx_templates,frontend_builds,frontend_deploys}.yml"
      when: manual
      allow_failure: true
  needs: ["$[[ inputs.src-folder ]] preprod build"]
  script:
    - dfx deploy --network $TARGET_NETWORK --no-wallet --mode reinstall -y $[[ inputs.src-folder ]]
  environment:
    name: preprod/$[[ inputs.src-folder ]]
    deployment_tier: testing
    action: start

# PRODUCTION DEPLOYMENT

$[[ inputs.src-folder ]] production deploy:
  stage: deploy
  interruptible: false
  resource_group: frontend production deployment
  variables:
    PEM_FILE: "${PEM_FILE_PRODUCTION}"
    DEPLOY_VIA_SNS_PROPOSAL: $[[ inputs.sns-controlled ]]
    TARGET_NETWORK: ic
  needs: ["$[[ inputs.src-folder ]] production build"]
  rules:
    # No "changes" list: GitLab evaluates "changes" to true on every tag
    # pipeline, so it never filtered anything here.
    - if: $CI_COMMIT_TAG =~ '/^$[[ inputs.src-folder ]]-v\d+\.\d+\.\d+$/'
      when: manual
  before_script:
    - !reference [.import dfx identity, before_script]
    - !reference [.include didc, before_script]
  script:
    - |
      echo "Deploying via proposal: " $DEPLOY_VIA_SNS_PROPOSAL
      if [ "$DEPLOY_VIA_SNS_PROPOSAL" = true ]; then
        . scripts/frontend-deploy/sns_frontend_deploy.sh $[[ inputs.src-folder ]] $TARGET_NETWORK
      else
        dfx deploy --network $TARGET_NETWORK --no-wallet --mode reinstall -y $[[ inputs.src-folder ]]
      fi
  environment:
    name: production/$[[ inputs.src-folder ]]
    deployment_tier: production
    action: start
