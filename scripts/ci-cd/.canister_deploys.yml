spec:
  inputs:
    src-folder:
      description: Name of the source folder, should be the same as the canister's cargo package name.
      options:
        [
          "buyback_burn",
          "gldt_swap",
          "gldt_swap_index",
          "icp_neuron",
          # "usdg",
          "management",
          "sns_neuron_controller",
          "sns_rewards",
          "super_stats_v3",
          "token_metrics",
          "gldt_stake",
        ]
---
# Rust canisters deployments

$[[ inputs.src-folder ]] staging deploy:
  stage: deploy
  resource_group: staging
  rules:
    - if: $CI_COMMIT_REF_NAME == "develop" && $CI_PIPELINE_SOURCE != "merge_request_event" # deployment when merged to develop
      changes:
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
    - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop" # deployment when trigger manually on MR
      changes:
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
      allow_failure: true
      when: manual
  needs:
    ["$[[ inputs.src-folder ]] staging build"]
    # ["$[[ inputs.src-folder ]] staging build", "integration tests"]
  variables:
    TARGET_NETWORK: staging
    PEM_FILE: "${PEM_FILE_STAGING}"
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - . scripts/canister-deploy/deploy-$[[ inputs.src-folder ]].sh $TARGET_NETWORK
  environment:
    name: $[[ inputs.src-folder ]]
    deployment_tier: staging
    action: start

$[[ inputs.src-folder ]] production deploy:
  stage: deploy
  resource_group: production
  rules:
    - if: $CI_COMMIT_TAG =~ '/^$[[ inputs.src-folder ]]-v\d+\.\d+\.\d+(-reinstall)?$/'
      changes:
        - "backend/libraries/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/external_canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
      when: manual
  variables:
    TARGET_NETWORK: ic
    PEM_FILE: "${PEM_FILE_PRODUCTION}"
  needs: ["$[[ inputs.src-folder ]] production build", "integration tests"]
  before_script:
    - !reference [.import dfx identity, before_script]
  script:
    - . scripts/canister-deploy/deploy-$[[ inputs.src-folder ]].sh $TARGET_NETWORK
  environment:
    name: $[[ inputs.src-folder ]]
    deployment_tier: production
    action: start

$[[ inputs.src-folder ]] github release:
  stage: deploy
  resource_group: github_release
  rules:
    - if: $CI_COMMIT_TAG =~ '/^$[[ inputs.src-folder ]]-v\d+\.\d+\.\d+(-reinstall)?$/'
      changes:
        - "backend/libraries/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/external_canisters/**/*.{rs,toml,lock,md,did,wasm,gz}"
        - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
      when: manual
    # - if: $CI_PIPELINE_SOURCE == "merge_request_event" && $CI_COMMIT_REF_NAME != "develop" # FOR TESTING ONLY, REMOVE AFTERWARDS!!!!
    #   changes:
    #     - "backend/canisters/$[[ inputs.src-folder ]]/**/*.{rs,toml,lock,md,did,wasm,gz}"
    #   when: manual
  needs: ["$[[ inputs.src-folder ]] production build"]
  variables:
    GITHUB_TOKEN: ${GITHUB_TOKEN}
    GITHUB_REPO: ${GITHUB_REPO}
  before_script:
    - apt-get update && apt-get install -y curl jq
  script:
    - |
      SRC_FOLDER="$[[ inputs.src-folder ]]"
      WASM_PATH="backend/canisters/${SRC_FOLDER}/target/wasm32-unknown-unknown/release/${SRC_FOLDER}_canister.wasm.gz"
      DID_PATH="backend/canisters/${SRC_FOLDER}/api/can.did"

      if [ ! -f "$WASM_PATH" ]; then
        echo "Wasm file not found: $WASM_PATH"
        exit 1
      fi

      if [ ! -f "$DID_PATH" ]; then
        echo "DID file not found: $DID_PATH — skipping DID upload"
        HAS_DID=false
      else
        HAS_DID=true
      fi

      RELEASE_NAME="Release $CI_COMMIT_TAG"

      RELEASE_RESPONSE=$(curl -s -X POST \
        -H "Authorization: token $GITHUB_TOKEN" \
        -H "Accept: application/vnd.github.v3+json" \
        "https://api.github.com/repos/$GITHUB_REPO/releases" \
        -d "{
          \"tag_name\": \"$CI_COMMIT_TAG\",
          \"name\": \"$RELEASE_NAME\",
          \"body\": \"Release automatic from GitLab CI\",
          \"draft\": false,
          \"prerelease\": false
        }")

      UPLOAD_URL=$(echo $RELEASE_RESPONSE | jq -r '.upload_url' | sed 's/{?name,label}//')

      echo "Uploading $WASM_PATH..."
      curl -s -X POST \
        -H "Authorization: token $GITHUB_TOKEN" \
        -H "Content-Type: application/octet-stream" \
        --data-binary @"$WASM_PATH" \
        "$UPLOAD_URL?name=${SRC_FOLDER}_canister.wasm.gz"

      if [ "$HAS_DID" = true ]; then
        echo "Uploading $DID_PATH..."
        curl -s -X POST \
          -H "Authorization: token $GITHUB_TOKEN" \
          -H "Content-Type: application/octet-stream" \
          --data-binary @"$DID_PATH" \
          "$UPLOAD_URL?name=can.did"
      fi
  environment:
    name: github_release
    deployment_tier: production
    action: start
