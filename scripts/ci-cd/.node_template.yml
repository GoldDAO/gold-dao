# NodeJS & NextJS job template

.node template:
  image: node:current-alpine3.22
  cache:
    - key: "node-$CI_COMMIT_REF_SLUG"
      paths:
        - .pnpm-store/
        - node_modules/
        - client/**/.next/
        - client/**/node_modules/
  before_script:
    - npm install -g pnpm@latest-10
