# dfx and quill commands templates

.import dfx identity:
  before_script:
    - echo "Loading identity for network" $TARGET_NETWORK
    - export DFX_WARNING=-mainnet_plaintext_identity
    - dfx --version
    - dfx identity import --storage-mode plaintext gitlab-ci-gldt $PEM_FILE > /dev/null 2>&1
    - dfx identity use gitlab-ci-gldt
    - dfx identity whoami
    - if [[ $(date -R) == "Fri"* ]]; then echo "It appear you are deploying on a Friday....."; fi
    - dfx identity get-principal

# didc encodes the payload of frontend upgrade proposals
.include didc:
  before_script:
    - curl -fsSL https://github.com/dfinity/candid/releases/download/2025-07-29/didc-linux64 > /usr/bin/didc
    # This job holds the production key: do not run a download that is not the expected file
    - echo "bd082fe97821e2323b742d14f2fc9e6c90a646fb06f8f8fc95c6032cd3d283e5  /usr/bin/didc" | sha256sum -c -
    - chmod +x /usr/bin/didc
    - didc --version
